[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The PyPI distribution is "cleanframe-engine"; the import package stays "cleanframe".
name = "cleanframe-engine"
dynamic = ["version"]
description = "The reproducible data-cleaning engine for Python. AI writes the recipe once; the recipe runs forever — deterministic, diffable, reviewable."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CleanFrame contributors" }]
keywords = [
    "data-cleaning",
    "pandas",
    "data-quality",
    "etl",
    "reproducible",
    "schema-drift",
    "data-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5,<4",
    "numpy>=1.23",
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
parquet = ["pyarrow>=12.0"]
llm = ["anthropic>=0.30", "openai>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "openpyxl>=3.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
all = ["openpyxl>=3.0", "pyarrow>=12.0", "anthropic>=0.30", "openai>=1.0"]

[project.scripts]
cleanframe = "cleanframe.cli:main"

[project.urls]
Homepage = "https://github.com/inboxpraveen/Cleanframe"
Repository = "https://github.com/inboxpraveen/Cleanframe"
Documentation = "https://github.com/inboxpraveen/Cleanframe/wiki"
Issues = "https://github.com/inboxpraveen/Cleanframe/issues"
Changelog = "https://github.com/inboxpraveen/Cleanframe/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "cleanframe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cleanframe"]

# An allow-list, so an untracked file in the working tree can never ship in a release.
[tool.hatch.build.targets.sdist]
only-include = [
    "cleanframe",
    "tests",
    "examples",
    "docs",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
]
exclude = ["docs/assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:cleanframe.*",
]

[tool.mypy]
# No python_version pin: it also governs how dependency stubs are parsed, and
# numpy's stubs use syntax that only parses on 3.12+. Minimum-version support is
# covered by ruff's target-version and by the 3.10 test job.
ignore_missing_imports = true
files = ["cleanframe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "UP038"]  # UP038 kept for older ruff; newer ruff dropped the rule
