name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix lean: full Python sweep on Ubuntu; smoke on Win/macOS.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest --cov=cleanframe --cov-report=term-missing --cov-fail-under=80

      # The library must also be correct on a console that cannot encode its glyphs.
      - name: Pytest (default console encoding)
        if: runner.os == 'Windows'
        run: pytest -q

  lint:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check cleanframe tests
      - name: Mypy
        run: mypy

  minimum-pins:
    name: minimum supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the declared floors
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==1.5.3" "numpy==1.23.5" "PyYAML==6.0" "Jinja2==3.0.3" \
                      "python-dateutil==2.8.2" "openpyxl==3.0.10" pytest
          pip install -e . --no-deps
      - run: pytest -q

  pandas-prerelease:
    name: pandas pre-release (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --pre --upgrade pandas numpy
      - run: pytest -q

  package:
    name: build + metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Refuse stray files in the sdist
        run: |
          set -euo pipefail
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | sort > /tmp/sdist.txt
          if grep -Ev '^(cleanframe|tests|examples|docs)/|^(CHANGELOG|CONTRIBUTING|README|SECURITY)\.md$|^(LICENSE|pyproject\.toml|PKG-INFO|\.gitignore)$|^$' /tmp/sdist.txt; then
            echo "::error::unexpected file in sdist (see list above)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
