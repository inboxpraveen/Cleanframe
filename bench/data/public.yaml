- id: schema-gst-invoice-amounts
  family: schema_match
  domain: tax (India GST)
  difficulty: hard
  rationale: >-
    A GST invoice: the taxable value is the net amount before tax, GST is the tax and
    the invoice total is the gross. The rules' weak guess maps "Taxable Value" onto
    tax_amount, which is wrong.
  columns:
    Invoice No: [INV/26/0412, INV/26/0413, INV/26/0414, INV/26/0415, INV/26/0416, INV/26/0417]
    Taxable Value: ["10,000.00", "2,450.00", "18,300.00", "640.00", "7,125.00", "3,980.00"]
    GST: ["1,800.00", "441.00", "3,294.00", "115.20", "1,282.50", "716.40"]
    Invoice Total: ["11,800.00", "2,891.00", "21,594.00", "755.20", "8,407.50", "4,696.40"]
  schema:
    invoice_number: {dtype: string}
    net_amount: {dtype: float}
    tax_amount: {dtype: float}
    gross_amount: {dtype: float}
  gold: {invoice_number: Invoice No, net_amount: Taxable Value, tax_amount: GST, gross_amount: Invoice Total}
  expect: {schema: [gross_amount, net_amount, tax_amount]}

