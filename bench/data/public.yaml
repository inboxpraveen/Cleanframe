  difficulty: hard
  rationale: >-
    IATA airport codes of Pacific routes: NAN is Nadi International Airport (Fiji),
    next to SYD, AKL and BNE - not "not a number".
  column: origin_airport
  values: {SYD: 8, AKL: 6, NAN: 5, BNE: 4, MEL: 3, SUV: 2}
  expect: {nulls: [NAN], alias: 5}

- id: null-wifi-encryption-none
  family: null_token
  domain: IT (network inventory)
  difficulty: standard
  rationale: >-
    A Wi-Fi access point's encryption setting: "None" is an open network, a real
    configuration (and a finding), not a missing value.
  column: encryption
  values: {WPA2: 9, WPA3: 6, None: 4, WEP: 2}
  expect: {nulls: [None], alias: 3}

- id: null-lot-number-unknown-question
  family: null_token
  domain: pharmaceutical supply chain
  difficulty: standard
  rationale: >-
    Batch lot numbers: "unknown" and "?" both mean the lot was not recorded.
  column: lot_number
  values: {unknown: 2, "?": 2, LOT24A117: 1, LOT24A121: 1, LOT24B004: 1, LOT24B019: 1, LOT24C233: 1, LOT24C240: 1, LOT24D051: 1, LOT24D066: 1}
  placeholders: [unknown, "?"]
  expect: {nulls: ["?", unknown]}

# ============================================================== schema_match
- id: schema-order-vs-ship-date
  family: schema_match
  domain: e-commerce
  difficulty: standard
  rationale: >-
    Two date columns: the order was placed on one date and dispatched on another.
    order_date is "Placed On", ship_date is "Dispatched On"; the amount is the INR
    total.
  columns:
    Order Ref: [ORD-10411, ORD-10412, ORD-10413, ORD-10414, ORD-10415, ORD-10416]
    Placed On: ["2026-03-02", "2026-03-02", "2026-03-04", "2026-03-05", "2026-03-07", "2026-03-08"]
    Dispatched On: ["2026-03-04", "2026-03-05", "2026-03-05", "2026-03-08", "2026-03-09", "2026-03-11"]
    Total (INR): ["₹1,240", "₹860", "₹2,315", "₹499", "₹3,100", "₹1,005"]
  schema:
    order_id: {dtype: string}
    order_date: {dtype: date}
    ship_date: {dtype: date}
    amount: {dtype: float}
  gold: {order_id: Order Ref, order_date: Placed On, ship_date: Dispatched On, amount: Total (INR)}
  expect: {schema: [amount, order_date, ship_date]}

