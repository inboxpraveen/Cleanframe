# CleanBench public split.
#
# Every scenario is a small messy table. CleanFrame's real pipeline decides which
# questions to ask about it; the gold below answers any of them:
#
#   same:          groups of spellings that name one thing; a spelling in no group is
#                  its own, distinct value.
#   placeholders:  tokens that mean "missing" in this column; every other value is data.
#   gold:          (schema scenarios) which source column holds each target, or null.
#   expect:        the questions the scenario is written to produce (checked by
#                  `python -m bench.cleanbench validate`): merge / nulls / schema list
#                  their subjects, alias is a count. A kind that is left out must not occur.
#
# Labelling rules (see bench/README.md#how-the-gold-is-written):
#   * Two spellings are the same only if a careful human who knows the domain would
#     merge them without asking anyone. Look-alikes, opposites, related-but-different
#     (debit/credit, hypo/hyper, Austria/Australia) are different.
#   * A token is a placeholder when it is not a value of the column's domain (a "-"
#     where a middle name goes). It is data when it is one of the answers the column
#     records ("None" for allergies, "-" for a DNA strand, "NA" for Namibia).
#   * All names, codes and records are invented; no real personal data.

version: 1
split: public
scenarios:

# ============================================================== category_alias
- id: alias-in-delivery-cities
  family: category_alias
  domain: logistics (India)
  difficulty: easy
  rationale: >-
    Indian cities under their old names, new names and airport codes. Bengaluru and
    BLR are Bangalore, Bombay is Mumbai, Madras is Chennai; Delhi stands alone.
  column: delivery_city
  values: {Bangalore: 9, Mumbai: 8, Delhi: 6, Chennai: 5, Bengaluru: 3, BLR: 2, Bombay: 2, Madras: 1}
  same: [[Bangalore, Bengaluru, BLR], [Mumbai, Bombay], [Chennai, Madras]]
  expect: {alias: 7}

- id: alias-us-ship-states
  family: category_alias
  domain: e-commerce (US)
  difficulty: standard
  rationale: >-
    A US ship-to state column mixing names, USPS codes and old abbreviations. CA and
    Calif. are California, TX is Texas, WA is Washington state. DC (District of
    Columbia) is not Washington state, and Kansas and Arkansas are different states.
  column: ship_state
  values: {California: 10, Texas: 8, Washington: 5, CA: 4, TX: 3, Kansas: 3, Arkansas: 3, Calif.: 2, WA: 2, DC: 2}
  same: [[California, CA, Calif.], [Texas, TX], [Washington, WA]]
  expect: {alias: 9}

- id: alias-north-america-country-codes
  family: category_alias
  domain: CRM (North America)
  difficulty: hard
  rationale: >-
    A country column with ISO 3166 alpha-2 codes next to US and MX, so CA is Canada
    here, not California. USA/US are the United States, MX and México are Mexico.
  column: country
  values: {United States: 10, Canada: 7, Mexico: 5, USA: 4, US: 3, CA: 2, MX: 2, México: 1}
  same: [[United States, USA, US], [Canada, CA], [Mexico, MX, México]]
  expect: {alias: 7}

- id: alias-eu-cities-endonyms
  family: category_alias
  domain: logistics (EU)
  difficulty: standard
  rationale: >-
    European cities in English and in their own language: München is Munich, Köln is
    Cologne, Wien is Vienna, Lisboa is Lisbon. Warsaw has no second spelling here.
  column: city
  values: {Munich: 8, Cologne: 6, Vienna: 5, Lisbon: 4, Warsaw: 4, München: 3, Köln: 2, Wien: 2, Lisboa: 2}
  same: [[Munich, München], [Cologne, Köln], [Vienna, Wien], [Lisbon, Lisboa]]
  expect: {alias: 8}

- id: alias-country-lookalikes
  family: category_alias
  domain: trade (global)
  difficulty: hard
  rationale: >-
    Pairs of countries whose names differ by a few letters - Austria/Australia,
    Slovakia/Slovenia, Niger/Nigeria, Iran/Iraq - are different countries. Holland is
    the everyday name of the Netherlands.
  column: destination_country
  values: {Australia: 7, Nigeria: 7, Slovakia: 6, Slovenia: 5, Netherlands: 5, Austria: 4, Iraq: 4, Niger: 3, Iran: 3, Holland: 2}
  same: [[Netherlands, Holland]]
  expect: {alias: 9}

- id: alias-hr-departments
  family: category_alias
  domain: HR
  difficulty: standard
  rationale: >-
    Department names and their standard abbreviations: HR, R&D, IT and Ops. Sales,
    Engineering and Finance have no second name here.
  column: department
  values: {Engineering: 10, Sales: 8, Human Resources: 5, Research and Development: 4, IT: 4, Operations: 4, HR: 3, R&D: 2, Information Technology: 2, Ops: 1}
  same: [[Human Resources, HR], [Research and Development, R&D], [IT, Information Technology], [Operations, Ops]]
  expect: {alias: 9}

- id: alias-insurance-negation
  family: category_alias
  domain: healthcare (US)
  difficulty: hard
  rationale: >-
    Negations are different categories. "Not insured" says the same as "Uninsured",
    but Underinsured (covered, but not enough) is neither insured nor uninsured.
  column: insurance_status
  values: {Insured: 10, Uninsured: 6, Underinsured: 3, Not insured: 2}
  same: [[Uninsured, Not insured]]
  expect: {alias: 3}

- id: alias-smoking-status
  family: category_alias
  domain: healthcare
  difficulty: standard
  rationale: >-
    Ex-smoker and Former smoker are one status, Smoker and Current smoker another;
    a non-smoker is neither.
  column: smoking_status
  values: {Non-smoker: 10, Smoker: 6, Ex-smoker: 3, Former smoker: 2, Current smoker: 2}
  same: [[Ex-smoker, Former smoker], [Smoker, Current smoker]]
  expect: {alias: 4}

- id: alias-in-payment-methods
  family: category_alias
  domain: e-commerce (India)
  difficulty: easy
  rationale: >-
    CC is a credit card and COD is cash on delivery. A debit card is not a credit card.
    "NetBanking" differs from "Net Banking" only by a space, which the rules merge on
    their own.
  column: payment_method
  values: {UPI: 12, Credit Card: 8, Cash on Delivery: 6, Debit Card: 4, Net Banking: 3, COD: 3, CC: 2, NetBanking: 1}
  same: [[Credit Card, CC], [Cash on Delivery, COD], [Net Banking, NetBanking]]
  expect: {alias: 6}

- id: alias-gender-codes
  family: category_alias
  domain: HR
  difficulty: easy
  rationale: >-
    F and M are Female and Male. Non-binary and "Prefer not to say" are answers of
    their own, not other names for either.
  column: gender
  values: {Female: 9, Male: 8, F: 3, M: 3, Non-binary: 2, Prefer not to say: 2}
  same: [[Female, F], [Male, M]]
  expect: {alias: 5}

- id: alias-de-gender-mwd
  family: category_alias
  domain: HR (Germany)
  difficulty: hard
  rationale: >-
    A German form's Geschlecht field: m/w/d abbreviate männlich, weiblich and divers
    (the legal third option). Each letter belongs to its own word.
  column: geschlecht
  values: {weiblich: 8, männlich: 7, w: 3, m: 2, divers: 2, d: 1}
  same: [[weiblich, w], [männlich, m], [divers, d]]
  expect: {alias: 5}

- id: alias-ledger-currencies
  family: category_alias
  domain: finance (Indian exporter)
  difficulty: standard
  rationale: >-
    An Indian exporter's ledger. Rs and ₹ are rupees (INR), US$ is USD, € is EUR and
    £ is GBP. The bare symbols are only offered as options; CleanFrame never asks about
    a value made only of a symbol.
  column: currency
  values: {INR: 10, USD: 8, EUR: 5, GBP: 3, Rs: 3, US$: 2, €: 2, ₹: 2, £: 1}
  same: [[INR, Rs, ₹], [USD, US$], [EUR, €], [GBP, £]]
  expect: {alias: 5}

- id: alias-product-categories
  family: category_alias
  domain: e-commerce (India)
  difficulty: hard
  rationale: >-
    "Home and Kitchen" is "Home & Kitchen" and "Mobile Phones" is the "Mobiles"
    category. Electrical goods (wiring, switches) are not Electronics, and Mobile
    Accessories are not phones.
  column: category
  values: {Electronics: 9, Home & Kitchen: 6, Mobiles: 5, Electrical: 4, Mobile Accessories: 3, Home and Kitchen: 2, Mobile Phones: 2}
  same: [[Home & Kitchen, Home and Kitchen], [Mobiles, Mobile Phones]]
  expect: {alias: 6}

- id: alias-in-state-codes
  family: category_alias
  domain: tax (India GST)
  difficulty: standard
  rationale: >-
    Indian states and their two-letter codes. AP is Andhra Pradesh; Arunachal Pradesh
    (AR) is a different state.
  column: state
  values: {Karnataka: 8, Maharashtra: 7, Tamil Nadu: 6, Andhra Pradesh: 5, KA: 3, MH: 2, TN: 2, AP: 2, Arunachal Pradesh: 2}
  same: [[Karnataka, KA], [Maharashtra, MH], [Tamil Nadu, TN], [Andhra Pradesh, AP]]
  expect: {alias: 8}

- id: alias-latam-cities
  family: category_alias
  domain: logistics (Latin America)
  difficulty: standard
  rationale: >-
    CDMX and Mexico City are Ciudad de México; in a list of Brazilian and Latin
    American cities "Rio" is Rio de Janeiro. Bogota without its accent is a typo the
    rules fold into Bogotá.
  column: ciudad
  values: {São Paulo: 7, Ciudad de México: 6, Rio de Janeiro: 5, Bogotá: 4, Buenos Aires: 4, CDMX: 3, Mexico City: 2, Rio: 2, Bogota: 1}
  same: [[Ciudad de México, CDMX, Mexico City], [Rio de Janeiro, Rio], [Bogotá, Bogota]]
  expect: {merge: [Bogota -> Bogotá], alias: 7}

- id: alias-devanagari-cities
  family: category_alias
  domain: logistics (India)
  difficulty: standard
  rationale: >-
    The same cities in Latin and Devanagari script: मुंबई is Mumbai, दिल्ली is Delhi,
    पुणे is Pune. Different cities in the same script are still different cities.
  column: city
  values: {Mumbai: 8, Delhi: 7, Pune: 5, Nagpur: 3, मुंबई: 3, दिल्ली: 2, पुणे: 2}
  same: [[Mumbai, मुंबई], [Delhi, दिल्ली], [Pune, पुणे]]
  expect: {alias: 6}

# ============================================================== category_merge
- id: merge-hospital-departments-uk-us
  family: category_merge
  domain: healthcare
  difficulty: easy
  rationale: >-
    British spellings of hospital departments (Paediatrics, Orthopaedics, Haematology)
    are the same departments as the American ones.
  column: department
  values: {Pediatrics: 10, Orthopedics: 9, Cardiology: 8, Neurology: 6, Hematology: 5, Paediatrics: 2, Orthopaedics: 2, Haematology: 1}
  same: [[Pediatrics, Paediatrics], [Orthopedics, Orthopaedics], [Hematology, Haematology]]
  expect:
    merge: [Haematology -> Hematology, Orthopaedics -> Orthopedics, Paediatrics -> Pediatrics]
    alias: 4

- id: merge-diagnoses-hypo-hyper
  family: category_merge
  domain: healthcare
  difficulty: hard
  rationale: >-
    Hypotension (low blood pressure) and Hypertension (high) are opposite conditions,
    as are Hyperthyroidism and Hypothyroidism, though each pair is two letters apart.
    "Hypertenstion" is a typo of Hypertension.
  column: diagnosis
  values: {Hypertension: 12, Hypothyroidism: 9, Asthma: 6, Migraine: 5, Hyperthyroidism: 3, Hypotension: 3, Hypertenstion: 1}
  same: [[Hypertension, Hypertenstion]]
  expect:
    merge: [Hypertenstion -> Hypertension]
    alias: 5

- id: merge-lab-electrolytes
  family: category_merge
  domain: healthcare (lab results)
  difficulty: hard
  rationale: >-
    Hyperkalemia/Hypokalemia and Hypernatremia/Hyponatremia are opposite lab findings.
    Hypokalaemia is the British spelling of Hypokalemia.
  column: lab_finding
  values: {Hypokalemia: 9, Hyponatremia: 8, Anemia: 6, Hyperkalemia: 3, Hypernatremia: 2, Hypokalaemia: 1}
  same: [[Hypokalemia, Hypokalaemia]]
  expect:
    merge: [Hypokalaemia -> Hypokalemia]
    alias: 4

- id: merge-pharmacy-lasa
  family: category_merge
  domain: pharmacy
  difficulty: hard
  rationale: >-
    Look-alike drug names that are different drugs: prednisolone is not prednisone,
    cycloserine (a TB antibiotic) is not cyclosporine (an immunosuppressant).
    Metfromin and Amoxicilin are typos.
  column: drug_name
  values: {Prednisone: 10, Metformin: 9, Cyclosporine: 8, Amoxicillin: 7, Prednisolone: 3, Cycloserine: 2, Metfromin: 1, Amoxicilin: 1}
  same: [[Metformin, Metfromin], [Amoxicillin, Amoxicilin]]
  expect:
    merge: [Amoxicilin -> Amoxicillin, Metfromin -> Metformin]
    alias: 5

- id: merge-food-additives
  family: category_merge
  domain: food manufacturing
  difficulty: hard
  rationale: >-
    Sodium nitrate (E251) and sodium nitrite (E250) are different additives. "Potasium
    sorbate" is a typo of potassium sorbate.
  column: additive
  values: {Sodium nitrite: 9, Sodium benzoate: 8, Potassium sorbate: 7, Sodium nitrate: 3, Potasium sorbate: 1}
  same: [[Potassium sorbate, Potasium sorbate]]
  expect:
    merge: [Potasium sorbate -> Potassium sorbate, Sodium nitrate -> Sodium nitrite]
    alias: 3

- id: merge-order-status-typos
  family: category_merge
  domain: e-commerce
  difficulty: easy
  rationale: >-
    Canceled is the US spelling of Cancelled; Delievered and Shiped are typos.
  column: order_status
  values: {Delivered: 12, Shipped: 9, Pending: 7, Cancelled: 6, Returned: 4, Canceled: 2, Delievered: 1, Shiped: 1}
  same: [[Delivered, Delievered], [Shipped, Shiped], [Cancelled, Canceled]]
  expect:
    merge: [Canceled -> Cancelled, Delievered -> Delivered, Shiped -> Shipped]
    alias: 4

- id: merge-gst-supply-type
  family: category_merge
  domain: tax (India GST)
  difficulty: hard
  rationale: >-
    Under GST an inter-state supply (IGST) and an intra-state supply (CGST + SGST)
    are taxed differently: two letters apart, never the same. "Inter state" and
    "Intrastate" differ from their hyphenated forms only by punctuation, and
    "Intra-sate" is a typo of Intra-state.
  column: supply_type
  values: {Intra-state: 12, Export: 4, Inter-state: 3, SEZ: 2, Inter state: 1, Intrastate: 1, Intra-sate: 1}
  same: [[Intra-state, Intrastate, Intra-sate], [Inter-state, Inter state]]
  expect:
    merge: [Intra-sate -> Intra-state]
    alias: 3

- id: merge-us-state-typos
  family: category_merge
  domain: retail (US)
  difficulty: standard
  rationale: >-
    Misspelled state names (Califronia, Pensylvania, Massachusets, Conneticut).
    Virginia and West Virginia are different states.
  column: state
  values: {California: 10, Pennsylvania: 8, Massachusetts: 6, Connecticut: 5, Virginia: 4, West Virginia: 3, Pensylvania: 2, Califronia: 1, Massachusets: 1, Conneticut: 1}
  same: [[California, Califronia], [Pennsylvania, Pensylvania], [Massachusetts, Massachusets], [Connecticut, Conneticut]]
  expect:
    merge: [Califronia -> California, Conneticut -> Connecticut, Massachusets -> Massachusetts, Pensylvania -> Pennsylvania]
    alias: 5

- id: merge-latam-accents
  family: category_merge
  domain: logistics (Latin America)
  difficulty: standard
  rationale: >-
    City names typed without accents or with a dropped letter (Bogota, Medellin, Sao
    Paulo, Guadalajra) are the same cities.
  column: ciudad
  values: {Bogotá: 9, São Paulo: 8, Medellín: 7, Guadalajara: 6, Valparaíso: 3, Bogota: 2, Medellin: 2, Sao Paulo: 2, Guadalajra: 1}
  same: [[Bogotá, Bogota], [Medellín, Medellin], [São Paulo, Sao Paulo], [Guadalajara, Guadalajra]]
  expect:
    merge: [Bogota -> Bogotá, Guadalajra -> Guadalajara, Medellin -> Medellín, Sao Paulo -> São Paulo]
    alias: 4

- id: merge-visa-application-status
  family: category_merge
  domain: government
  difficulty: hard
  rationale: >-
    Deferred (decision postponed) and Referred (sent to another officer) are different
    outcomes one letter apart. Aproved is a typo.
  column: application_status
  values: {Approved: 12, Deferred: 9, Rejected: 8, Withdrawn: 4, Referred: 3, Aproved: 1}
  same: [[Approved, Aproved]]
  expect:
    merge: [Aproved -> Approved, Referred -> Deferred]
    alias: 4

- id: merge-in-city-spellings
  family: category_merge
  domain: logistics (India)
  difficulty: easy
  rationale: >-
    Variant spellings of Indian cities: Hyderbad, Ahmadabad, Nasik and Simla are
    Hyderabad, Ahmedabad, Nashik and Shimla.
  column: city
  values: {Hyderabad: 10, Ahmedabad: 9, Pune: 7, Nashik: 6, Shimla: 4, Ahmadabad: 2, Nasik: 2, Hyderbad: 1, Simla: 1}
  same: [[Hyderabad, Hyderbad], [Ahmedabad, Ahmadabad], [Nashik, Nasik], [Shimla, Simla]]
  expect:
    merge: [Ahmadabad -> Ahmedabad, Hyderbad -> Hyderabad, Nasik -> Nashik, Simla -> Shimla]
    alias: 4

- id: merge-physio-movements
  family: category_merge
  domain: physiotherapy
  difficulty: hard
  rationale: >-
    Abduction (away from the midline) and adduction (towards it) are opposite
    movements, one letter apart. Extention is a typo of Extension.
  column: movement
  values: {Flexion: 9, Extension: 8, Abduction: 7, Rotation: 5, Adduction: 2, Extention: 1}
  same: [[Extension, Extention]]
  expect:
    merge: [Adduction -> Abduction, Extention -> Extension]
    alias: 4

- id: merge-symptoms-dys
  family: category_merge
  domain: healthcare
  difficulty: hard
  rationale: >-
    Dysphagia (difficulty swallowing) and dysphasia (difficulty speaking) are
    different symptoms. Dyspnoea is the British spelling of dyspnea.
  column: symptom
  values: {Dyspnea: 9, Dysphagia: 8, Dyspepsia: 5, Dysuria: 4, Dysphasia: 2, Dyspnoea: 2}
  same: [[Dyspnea, Dyspnoea]]
  expect:
    merge: [Dysphasia -> Dysphagia, Dyspnoea -> Dyspnea]
    alias: 4

# ============================================================== null_token
- id: null-allergies-none-is-data
  family: null_token
  domain: healthcare
  difficulty: hard
  rationale: >-
    "None" in an allergies column records the answer "no known allergies" - turning it
    into a missing value loses that. "?" is an unanswered field.
  column: allergies
  values: {None: 12, Penicillin: 5, Peanuts: 4, Shellfish: 3, Latex: 2, Sulfa drugs: 2, "?": 2}
  placeholders: ["?"]
  expect: {nulls: ["?", None], alias: 6}

- id: null-middle-name-dash
  family: null_token
  domain: CRM
  difficulty: easy
  rationale: >-
    A dash where a middle name goes means the person has none recorded.
  column: middle_name
  values: {"-": 6, Kumar: 1, Rose: 1, James: 1, Anne: 1, Lee: 1, Marie: 1, Prakash: 1, Elena: 1, Wei: 1}
  placeholders: ["-"]
  expect: {nulls: ["-"]}

- id: null-blood-group-unknown
  family: null_token
  domain: healthcare
  difficulty: standard
  rationale: >-
    "Unknown" is not a blood group: the group was not recorded.
  column: blood_group
  values: {O+: 8, A+: 6, B+: 5, Unknown: 3, AB+: 2}
  placeholders: [Unknown]
  expect: {nulls: [Unknown], alias: 4}

- id: null-namibia-country-code
  family: null_token
  domain: trade (southern Africa)
  difficulty: hard
  rationale: >-
    ISO 3166 alpha-2 codes of southern African countries: NA is Namibia, between ZA,
    BW and ZW, not "not available".
  column: country_code
  values: {ZA: 9, BW: 5, NA: 5, ZW: 4, MZ: 3, ZM: 3}
  expect: {nulls: [NA], alias: 5}

- id: null-dna-strand
  family: null_token
  domain: bioinformatics
  difficulty: hard
  rationale: >-
    In a genome annotation "-" is the minus strand, as real as "+". "?" is an
    unknown strand.
  column: strand
  values: {"+": 9, "-": 8, "?": 2}
  placeholders: ["?"]
  expect: {nulls: ["-", "?"], alias: 1}

- id: null-chess-annotation
  family: null_token
  domain: games (chess)
  difficulty: hard
  rationale: >-
    Chess move annotations: "?" marks a mistake, "??" a blunder, "!" a good move. The
    "?" is data.
  column: annotation
  values: {"!": 6, "?": 5, "??": 3, "!!": 2, "!?": 2, "?!": 2}
  expect: {nulls: ["?"], alias: 5}

- id: null-phone-extension-double-dash
  family: null_token
  domain: CRM
  difficulty: standard
  rationale: >-
    "--" in a phone-extension column means the contact has no extension recorded.
