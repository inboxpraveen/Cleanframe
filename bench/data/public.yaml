- id: schema-invoice-vs-due-date
  family: schema_match
  domain: finance (accounts payable)
  difficulty: standard
  rationale: >-
    Three dates on a bill: it was issued on the Bill Date, must be paid by the Pay By
    date, and covers a period ending on Period End. invoice_date is the bill date,
    due_date the pay-by date.
  columns:
    Vendor: [Northwind Supplies, Blue Harbor Freight, Kestrel Office, Northwind Supplies, Arcadia Power, Blue Harbor Freight]
    Bill Date: ["2026-01-05", "2026-01-09", "2026-01-12", "2026-02-04", "2026-02-07", "2026-02-10"]
    Pay By: ["2026-02-04", "2026-02-08", "2026-01-27", "2026-03-06", "2026-02-21", "2026-03-11"]
    Period End: ["2025-12-31", "2025-12-31", "2025-12-31", "2026-01-31", "2026-01-31", "2026-01-31"]
  schema:
    invoice_date: {dtype: date}
    due_date: {dtype: date}
  gold: {invoice_date: Bill Date, due_date: Pay By}
  expect: {schema: [due_date, invoice_date]}

